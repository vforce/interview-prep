- id: pd_top_n-q0
  q: To get the top-n rows per group ranked by a numeric column, which approach works and why?
  choices:
  - Compute the per-group mean of the column and keep only rows above that mean
  - Group the rows first, then sort the group labels alphabetically, then take the first n rows overall
  - Sort the whole DataFrame by that column descending, then take the first n rows of each group — sorting puts each group's rows in descending order, so the first n encountered are the top n
  - Take the single maximum row per group and duplicate it n times
  answer: 2
