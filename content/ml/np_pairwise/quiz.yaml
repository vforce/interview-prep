- id: np_pairwise-q2
  q: Computing all pairwise Euclidean distances between an (m, d) array and an (n, d) array via broadcasting, instead of an explicit double loop, has what practical cost?
  choices:
  - It changes the mathematical result depending on m and n
  - It cannot be vectorized, so it gives no speedup over loops
  - It materializes an intermediate array of size m*n*d, which can exhaust memory for large m, n, or d
  - It only works when m equals n
  answer: 2
- id: np_pairwise-q3
  q: For high-dimensional vectors (large d), a common trick computes pairwise squared Euclidean distances more memory-efficiently than broadcasting the full difference tensor, using matrix multiplication instead. Which identity does this rely on?
  choices:
  - '||a - b||^2 = ||a||^2 - ||b||^2'
  - '||a - b||^2 = ||a||^2 + ||b||^2 - 2 a·b'
  - '||a - b||^2 = ||a||^2 * ||b||^2'
  - '||a - b||^2 = (||a|| - ||b||)^2'
  answer: 1
- id: np_pairwise-q4
  q: The 'expand the square' identity (||a||^2 + ||b||^2 - 2a·b) for pairwise squared distances, computed via a matrix-multiplication term, has a known numerical gotcha. What is it?
  choices:
  - It always overestimates the true distance
  - It only works for integer-valued vectors
  - It cannot be computed using BLAS/GEMM routines
  - Floating-point rounding can make the value for near-identical vectors slightly negative, causing sqrt to return NaN unless clipped to 0
  answer: 3
