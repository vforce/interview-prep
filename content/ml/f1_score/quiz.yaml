- id: f1_score-q0
  q: What is the F1 score, in terms of precision and recall?
  choices:
  - 'Their geometric mean: sqrt(precision * recall)'
  - 'Their harmonic mean: 2 * precision * recall / (precision + recall)'
  - 'Their arithmetic mean: (precision + recall) / 2'
  - The minimum of precision and recall
  answer: 1
- id: f1_score-q1
  q: Why is the harmonic mean used to combine precision and recall into F1, instead of a simple average?
  choices:
  - It stays low unless both precision and recall are high, punishing large imbalances between them
  - It is cheaper to compute than an average
  - It is mathematically identical to accuracy
  - It rewards models that maximize only one of the two metrics
  answer: 0
