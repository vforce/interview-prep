- id: f1_score-q4
  q: F1 score is especially preferred over plain accuracy in which situation?
  choices:
  - When you want a metric that ignores false negatives entirely
  - When you want a metric that ignores false positives entirely
  - When classes are perfectly balanced and all errors cost the same
  - When classes are imbalanced, so a model could get high accuracy while missing most of the minority class
