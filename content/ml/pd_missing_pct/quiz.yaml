  q: Given a boolean DataFrame (True/False per cell), why does taking .mean() of each column yield the fraction of True values in that column?
  choices:
  - Because pandas treats boolean columns as categorical and reports mode frequency
  - Because True and False are treated as 1 and 0, so averaging them equals the proportion of 1s
  - Because .mean() ignores False values entirely when computing the average
  - Because .mean() silently converts booleans to percentages before averaging
  answer: 1
- id: pd_missing_pct-q2
  q: When you call DataFrame.mean() with default arguments, what is computed for each column?
  choices:
  - A single average collapsing the entire DataFrame into one number
  - The average of all row values in that column, giving one number per column
  - The average of that column's value against every other column
  - The average of only the first and last row in that column
  answer: 1
