# One study card. `id` is stable — it keys spaced-repetition progress. Don't rename it.

id: pd_missing_pct
type: kata
area: Pandas
order: 43
title: Missing-value fraction per column (Pandas)
prompt: Given a DataFrame, return a Series mapping each column to the FRACTION of its values that are missing (NaN), sorted most-missing first.
sig: 'def missing_pct(df):'
stub: "import pandas as pd\n\ndef missing_pct(df):\n    \n    return s\n"
reference: |
  import pandas as pd

  def missing_pct(df):
      # Three links, and the middle one is the idiom worth stealing:
      #   .isna()                       DataFrame -> DataFrame of BOOLS, same shape (True == missing)
      #   .mean()                       -> Series, one value per COLUMN (axis=0 is the default)
      #   .sort_values(ascending=False) -> Series, worst column first
      #
      # Why .mean() gives a FRACTION: True is 1 and False is 0, so averaging a boolean column
      # IS the proportion that are True. Same reflex as (arr > 0).mean() in NumPy.
      # Swap .mean() for .sum() and you get the raw count instead.
      #
      # sort_values orders by the VALUES; sort_index would order by the column names.
      return df.isna().mean().sort_values(ascending=False)   # -> Series indexed by column name
test: |
  import pandas as pd, numpy as np
  df = pd.DataFrame({"a": [1, 2, 3, 4],
                     "b": [np.nan, np.nan, 3, 4],
                     "c": [np.nan] * 4})
  s = missing_pct(df)
  assert list(s.index) == ["c", "b", "a"], list(s.index)
  assert np.isclose(s["c"], 1.0) and np.isclose(s["b"], 0.5) and np.isclose(s["a"], 0.0), s.to_dict()
  print("PASS - 2 checks")
