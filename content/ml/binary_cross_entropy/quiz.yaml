- id: binary_cross_entropy-q0
  q: What is the correct per-example formula for binary cross-entropy given true label y ∈ {0,1} and predicted probability p ∈ (0,1)?
  choices:
  - (y - p)^2
  - -[y·log(p) + (1-y)·log(1-p)]
  - '|y - p|'
  - y·log(p) - (1-y)·log(1-p)
  answer: 1
- id: binary_cross_entropy-q1
  q: Why must predicted probabilities be clamped away from exactly 0 and 1 before computing binary cross-entropy?
  choices:
  - It prevents numerical overflow in an exponential computation
  - log(0) is undefined (goes to -infinity), which would make the loss blow up or produce NaN
  - It ensures the probabilities of all classes sum to 1
  - It speeds up gradient descent convergence
  answer: 1
- id: binary_cross_entropy-q2
  q: For a true label y=1, how does binary cross-entropy loss compare between a prediction of p=0.01 versus p=0.5?
  choices:
  - The loss is much larger at p=0.01, since -log(p) grows sharply as p approaches 0
  - The loss is smaller at p=0.01 because the model is more decisive
  - The loss is undefined at p=0.01
  - The loss is identical in both cases because BCE is linear in p
  answer: 0
- id: binary_cross_entropy-q3
  q: Minimizing average binary cross-entropy over a dataset is equivalent to which statistical estimation objective?
  choices:
  - Minimizing the L1 distance between predictions and labels
  - Maximizing the variance of the predicted probabilities
  - Maximum likelihood estimation assuming each label is a Bernoulli random variable with parameter p
  - Minimizing mean squared error under a Gaussian noise assumption
  answer: 2
- id: binary_cross_entropy-q4
  q: In a neural network trained with binary cross-entropy loss on a single output unit, which activation should produce that unit's output?
  choices:
  - ReLU, since it is the default hidden-layer activation
  - Tanh, since it is bounded
  - A linear (identity) activation, since BCE can accept any real number
  - Sigmoid, since it squashes the raw score into a valid (0,1) probability
  answer: 3
