id: binary_cross_entropy
type: kata
area: Activations & Losses
order: 36
title: Binary cross-entropy
prompt: Implement mean binary cross-entropy for y_true (0/1) and y_prob (in (0,1)). BCE = -mean( y·log(p) + (1-y)·log(1-p) ). Clamp p away from 0 and 1 to avoid log(0).
sig: 'def binary_cross_entropy(y_true, y_prob):'
stub: "import math\n\ndef binary_cross_entropy(y_true, y_prob):\n    \n    return loss\n"
reference: |-
  import math

  def binary_cross_entropy(y_true, y_prob):
      eps = 1e-12
      total = 0.0
      for y, p in zip(y_true, y_prob):
          p = min(max(p, eps), 1 - eps)
          total += y * math.log(p) + (1 - y) * math.log(1 - p)
      return -total / len(y_true)
test: |
  import math
  def _c(a, b): return abs(a - b) < 1e-6
  assert _c(binary_cross_entropy([1], [0.5]), -math.log(0.5)), binary_cross_entropy([1], [0.5])
  assert _c(binary_cross_entropy([1,0], [0.9,0.1]), -(math.log(0.9)+math.log(0.9))/2), binary_cross_entropy([1,0],[0.9,0.1])
  assert binary_cross_entropy([1,0], [0.99,0.01]) < binary_cross_entropy([1,0], [0.6,0.4]), "confident-correct => lower loss"
  print("PASS - 3 cases")
