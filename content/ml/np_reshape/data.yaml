# One study card. `id` is stable — it keys spaced-repetition progress. Don't rename it.

id: np_reshape
type: kata
area: NumPy
order: 50
title: Reorder axes vs reshape (NumPy)
prompt: >-
  A batch of images arrives as NCHW (batch, channels, height, width); your model wants NHWC, then a
  flat feature matrix. Return `(nhwc, flat)` — `nhwc` with the channel axis moved last, and `flat`
  of shape (N, H*W*C). The trap: `x.reshape(n, h, w, c)` produces exactly the right *shape* and
  silently scrambles every pixel, because reshape only reinterprets the buffer in order — it cannot
  reorder axes. Only `moveaxis` / `transpose` actually move data.
sig: 'def to_nhwc_flat(x):'
stub: "import numpy as np\n\ndef to_nhwc_flat(x):\n    # move the channel axis to the end, THEN flatten each sample\n    \n    return nhwc, flat\n"
reference: |
  import numpy as np

  def to_nhwc_flat(x):                    # x is (N, C, H, W)
      # moveaxis(arr, src, dst) physically REORDERS the data: "take axis 1, put it last".
      # reshape can never do this — it re-reads the same buffer in memory order under a new
      # shape, so x.reshape(N,H,W,C) gives the right shape over the wrong bytes. Silent corruption.
      nhwc = np.moveaxis(x, 1, -1)        # (N,C,H,W) -> (N,H,W,C)  == x.transpose(0, 2, 3, 1)
      # -1 means "infer this axis from the total number of elements" — exactly one axis may be -1.
      # len(x) is x.shape[0]. Here reshape must copy, because moveaxis left nhwc non-contiguous.
      flat = nhwc.reshape(len(x), -1)     # (N,H,W,C) -> (N, H*W*C)   one flat feature row per sample
      return nhwc, flat
test: |
  import numpy as np

  n, c, h, w = 2, 3, 4, 5
  x = np.arange(n * c * h * w).reshape(n, c, h, w)
  nhwc, flat = to_nhwc_flat(x)

  assert nhwc.shape == (n, h, w, c), nhwc.shape
  assert flat.shape == (n, h * w * c), flat.shape

  # the trap: same shape, wrong data — reshape can't reorder axes
  assert not np.array_equal(nhwc, x.reshape(n, h, w, c)), "reshape only reinterprets; use moveaxis/transpose"

  # every pixel must survive the move: nhwc[n, i, j, k] is x[n, k, i, j]
  assert nhwc[0, 2, 3, 1] == x[0, 1, 2, 3], (nhwc[0, 2, 3, 1], x[0, 1, 2, 3])
  assert nhwc[1, 0, 0, 2] == x[1, 2, 0, 0]

  # flat is just each sample unrolled
  assert np.array_equal(flat[0], nhwc[0].ravel())

  print("PASS - 6 checks")
