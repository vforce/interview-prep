- id: t-multihead-q0
  q: What does multi-head attention do, per the card's definition?
  choices:
  - Run h independent full-d_model attention layers and sum their outputs
  - Use h different sequence lengths and merge them via pooling
  - Apply attention once, then split the output into h chunks for downstream layers
  - Split d_model into h heads, each attending in a d_model/h subspace, then concatenate and project
