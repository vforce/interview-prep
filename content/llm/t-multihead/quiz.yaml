- id: t-multihead-q1
  q: For d_model=512, h=8, d_k=64, what is the softmax scaling factor in each head's attention, and why?
  choices:
  - 1/√512, because scaling is by the square root of d_model
  - 1/64, because scaling is by d_k directly (no square root)
  - 1/√64 = 1/8, because scaling is by the square root of the per-head dimension d_k
  - 1/8, because scaling is by the number of heads h
