  q: Why do Transformers need positional encodings?
  choices:
  - Because it reduces the O(n²) cost of self-attention
  - Because self-attention is permutation-invariant, so word order would otherwise be lost
  - Because attention weights would otherwise sum to more than 1
  - Because token embeddings are too low-dimensional to train well
  answer: 1
