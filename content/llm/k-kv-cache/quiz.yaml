- id: k-kv-cache-q2
  q: What is the core intuition behind the KV cache?
  choices:
  - Only the most recent token's Key and Value matter for prediction
  - Attention scores for old tokens decay to zero, so they can be dropped
  - Keys and Values are cheaper to compute than Queries, so caching them saves the most time
  - A past token's Key and Value never change on later steps, so recomputing them is wasted work
