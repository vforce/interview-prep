- id: l-scaling-laws-q1
  q: In the compute rule FLOPs ≈ 6·N·D, what does the factor 6 represent?
  choices:
  - The batch size multiplied by sequence length
  - 2 (multiply-add) × 3 (forward + backward passes)
  - 6 bytes per parameter used in mixed-precision training
  - 6 transformer layers processed per token
