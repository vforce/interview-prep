  q: Chinchilla (70B params, 1.4T tokens) beat GPT-3 (175B params, 300B tokens) at comparable compute. What does this show?
  choices:
  - Token count only matters below 1 trillion tokens
  - Scaling data together with parameters beats scaling parameters alone
  - Compute budget is irrelevant to final model quality
  - Larger parameter counts always produce lower loss
  answer: 1
