  q: Llama-3 8B trained on ~1875 tokens/param, far above Chinchilla's ~20 tokens/param optimum. What justifies this?
  choices:
  - More tokens per parameter always minimizes training FLOPs
  - 8B models overfit unless trained past 1000 tokens/param
  - Chinchilla's scaling law doesn't apply to models under 10B parameters
  - Chinchilla optimizes training compute only; an overtrained small model is cheaper to serve at scale
  answer: 3
- id: l-scaling-laws-q4
  q: The card says to 'scale N and D together, not N alone.' What mistake does this guard against?
  choices:
  - Increasing parameters without proportionally increasing data, causing diminishing loss improvement
