  q: Why is cosine_sim('cat', 'dog') high (~0.98) while cosine_sim('cat', 'run') is low (~0.15)?
  choices:
  - Learned embeddings place semantically/categorically similar tokens (animals) near each other in vector space
  - '''cat'' and ''dog'' were assigned adjacent token ids during tokenization'
  - Attention layers have already merged 'cat' and 'dog' into one representation
  - '''run'' has a larger d_model dimension than ''cat'' and ''dog'''
  answer: 0
- id: l-embeddings-q3
  q: Why is the embedding matrix often tied with the output (un-embedding) layer?
  choices:
  - It replaces the need for positional encodings entirely
  - It converts the static embeddings into context-dependent vectors
  - It reuses the same V×d_model weights for both, saving V×d_model parameters and usually helping performance
  - It forces the model to predict only tokens it has seen as input
  answer: 2
