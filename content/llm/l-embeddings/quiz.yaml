  q: In the toy example (V=4, d_model=3), what does getting the embedding for token id 2 ('run') actually require?
  choices:
  - Multiplying token id 2 by the d_model vector of every other token
  - Indexing row 2 of the embedding matrix E — no computation, just a lookup
  - Averaging the embeddings of all tokens sharing id 2's context
  - Running token id 2 through a softmax over all 4 vocab entries
