- id: l-tokenization-q0
  q: What problem does subword tokenization (e.g., BPE) primarily solve compared to word-level or character-level tokenization?
  choices:
  - It eliminates the need for any fixed vocabulary size
  - It guarantees every token corresponds to exactly one word
  - It removes the need for byte-level fallback handling
  - It balances vocabulary size against sequence length, keeping common words as one token and splitting rare ones
  answer: 3
