- id: l-pretraining-q0
  q: What objective is used to pretrain LLMs?
  choices:
  - Reinforcement learning from human feedback
  - Self-supervised next-token prediction using cross-entropy loss
  - Contrastive learning between paired sentences
  - Supervised classification on human-labeled examples
  answer: 1
- id: l-pretraining-q1
  q: For context "The cat sat on the ___", the model assigns P(mat) = 0.4 to the true next token. What loss does that token contribute?
  choices:
  - -ln(0.4) ≈ 0.92 nats
  - e^0.4 ≈ 1.49 nats
  - ln(0.4) ≈ -0.92 nats
  - 0.4 nats
  answer: 0
- id: l-pretraining-q2
  q: Why doesn't next-token pretraining require human-annotated labels?
  choices:
  - The model clusters tokens unsupervised to invent its own labels
  - RLHF supplies the labels afterward, so pretraining doesn't need any
  - The text labels itself — each token's true successor is the target, so a causal mask lets one forward pass supervise all T positions at once
  - Perplexity substitutes for labels during training
  answer: 2
- id: l-pretraining-q3
  q: Per the card, what do instruction-tuning and RLHF mostly do relative to pretraining?
  choices:
  - Mostly realign the existing pretrained distribution rather than add new knowledge
  - Are required before perplexity can be computed
  - Inject the vast majority of the model's factual knowledge
  - Replace cross-entropy with an entirely new training objective
  answer: 0
- id: l-pretraining-q4
  q: What is the "exposure bias" gotcha from teacher forcing?
  choices:
  - Training conditions on true previous tokens, but inference conditions on the model's own generated tokens, so early mistakes compound
  - Perplexity is biased because it exponentiates the loss
  - The model overfits from being exposed to too many training tokens
  - The causal mask leaks future tokens during training
  answer: 0
